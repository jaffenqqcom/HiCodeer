[package]
name = "launch-zed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NAPI entry that launches Zed on HarmonyOS NEXT"

[lib]
name = "hicodeer"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Default backend: the on-device daemon command server (public HNP on the same
# device), reached over loopback SSH through the self-contained cmd-client
# crate. Replaces the retired openeuler-agent / qemu-agent backends.
default = ["daemon-agent", "qemu-agent"]
daemon-agent = ["dep:cmd-client"]
# Embedded QEMU guest backend: boot the guest and mount work dirs into it.
qemu-agent = ["dep:qemu-manager", "dep:cmd-client"]

[dependencies]
zed = { path = "../../../zed" }
workspace = { path = "../../../workspace" }
zlog = { path = "../../../zlog" }
gpui_ohos = { path = "../.." }
openharmony-ability = { path = "../openharmony-ability/crates/ability" }
openharmony-ability-derive = { path = "../openharmony-ability/crates/derive" }
cmd-client = { path = "../cmd-agent/cmd-client", optional = true }
# qemu_debug_assertions is deliberately NOT enabled by default: it forwards the
# guest serial console (QEMU stdout/stderr) into hilog, which blocks the TCG
# vCPUs on every console write and makes hilog a heavy device disk writer. Add
# `, features = ["qemu_debug_assertions"]` back only when debugging guest boot.
qemu-manager = { path = "../qemu-mngt/qemuctrl", optional = true, features = ["qemu_debug_assertions"] }
gpui_ohos_linker.workspace = true
util = { path = "../../../util" }
log = "0.4"
libc = "0.2"
smol.workspace = true
napi-ohos = "1.1.6"
napi-derive-ohos = "1.1.6"

[build-dependencies]
napi-build-ohos = "1.1.6"
