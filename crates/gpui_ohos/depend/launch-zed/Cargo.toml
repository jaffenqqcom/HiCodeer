[package]
name = "launch-zed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NAPI entry that launches Zed on HarmonyOS NEXT"

[lib]
name = "zcoder"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# Default backend: the OpenEuler VM cmd-agent path (daemon + business client
# reaching the VM server over TCP). Exactly one of openeuler-agent / qemu-agent
# must be enabled; switch with --no-default-features --features qemu-agent.
default = ["openeuler-agent"]
# OpenEuler VM backend: cmd-agent daemon + client, requires the VM server.
openeuler-agent = ["dep:cmd-agent", "dep:cmd-agent-linker", "workspace/openeuler-agent", "util/openeuler-agent"]
# In-process QEMU backend: dlopen libqemu-system-aarch64.so and boot a Linux
# guest with virtio-fs shared folders and an SSH command channel. Build with
# --no-default-features --features qemu-agent to replace the OpenEuler VM.
qemu-agent = ["dep:qemu-ssh-agent", "dep:qemu-ssh-agent-linker", "zed/qemu-agent", "workspace/qemu-agent", "util/qemu-agent"]
# Debug-only QEMU diagnostics (stderr/stdout -> hilog); forwarded to qemu-ssh-agent.
qemu_debug_assertions = ["qemu-ssh-agent/qemu_debug_assertions"]

[dependencies]
zed = { path = "../../../zed" }
workspace = { path = "../../../workspace" }
gpui_ohos = { path = "../.." }
openharmony-ability = { path = "../openharmony-ability/crates/ability" }
openharmony-ability-derive = { path = "../openharmony-ability/crates/derive" }
cmd-agent = { path = "../ohos-openeuler-agent/cmd-agent", optional = true }
cmd-agent-linker = { path = "../ohos-openeuler-agent/cmd-agent-linker", optional = true }
qemu-ssh-agent = { path = "../ohos-qemu-agent/ssh-agent/qemu-ssh-agent", optional = true }
qemu-ssh-agent-linker = { path = "../ohos-qemu-agent/ssh-agent-linker", optional = true }
gpui_ohos_linker.workspace = true
util = { path = "../../../util" }
log = "0.4"
libc = "0.2"
smol.workspace = true
napi-ohos = "1.1.6"
napi-derive-ohos = "1.1.6"

[build-dependencies]
napi-build-ohos = "1.1.6"
