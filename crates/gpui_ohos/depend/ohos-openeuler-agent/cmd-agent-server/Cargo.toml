# Standalone workspace root. cmd-agent-server is built by script/bundle-ohos via
# `cargo build --manifest-path` with the host toolchain and runs on the VM. The
# empty [workspace] stops cargo from searching upward and tripping over the
# placeholder Cargo.toml in ohos-openeuler-agent/ (which deliberately declares
# no [workspace]/[package]).
[workspace]

[package]
name = "cmd-agent-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cmd-agent-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cmd-agent-protocol = { path = "../cmd-agent-protocol" }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
