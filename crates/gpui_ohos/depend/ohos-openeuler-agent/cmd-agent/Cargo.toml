[package]
name = "cmd-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "cmd_agent"
path = "src/lib.rs"
# rlib only: the daemon now runs as a zcoder thread (spawned via
# `daemon::spawn_daemon`), so the OHOS child-process cdylib entry
# (libcmd_agent.so) is no longer needed.
crate-type = ["rlib"]

[[bin]]
name = "cmd-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cmd-agent-linker = { path = "../cmd-agent-linker" }
cmd-agent-protocol = { path = "../cmd-agent-protocol" }
env_logger = "0.11"
notify = "6.1"
futures-io = "0.3"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
# Default russh enables the aws-lc-rs backend (aws-lc-sys: slow C/CMake build).
# Prefer the ring backend: pure Rust, compiles much faster.
russh = { version = "0.55", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
serde_json = "1.0"
smol = "2"
async-io = "2"
