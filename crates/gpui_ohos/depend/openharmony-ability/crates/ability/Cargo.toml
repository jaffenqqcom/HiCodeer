[package]
name = "openharmony-ability"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binding Rust application on Harmony with Ability"

[features]
default = []

[dependencies]
# common dependencies
futures-channel = "0.3"

# for napi binding
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"
log = "0.4"

# for xcomponent native render
ohos-arkui-binding = { version = "0.2", features = ["napi"] }
# 由根 Cargo.toml [patch.crates-io] 指向本地化副本 gpui_ohos/depend/ohos-xcomponent-binding
# api-20：启用 OH_NativeXComponent_GetKeyEventModifierKeyStates（since 20），按键事件自带修饰键状态
ohos-xcomponent-binding = { version = "0.3", features = ["api-20"] }
# 直接依赖以便消费 ArkUIInputEvent（鼠标/滚轮 UIInputEvent 通道，见 render/xcomponent.rs）
ohos-arkui-input-binding = { version = "0.1", features = ["api-20"] }
ohos-ime-binding = "0.2"
ohos-display-binding = "0.1"
