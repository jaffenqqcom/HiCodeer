[package]
name = "worker-pool"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Small std-only worker thread pool with three priority levels, shared across OHOS adapters"

[dependencies]
# Do NOT use `workspace = true`: this crate is consumed from the host application workspace
# (via gpui_ohos), a different workspace that does not define the openharmony-ability
# workspace dependencies (see crates/plugin-cursor/Cargo.toml for the same constraint).
log = "0.4"
