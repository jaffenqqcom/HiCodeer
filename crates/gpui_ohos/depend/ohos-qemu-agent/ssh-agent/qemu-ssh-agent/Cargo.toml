[package]
name = "qemu-ssh-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "In-process QEMU runner and SSH-connection-pool command executor for HarmonyOS NEXT"

[lib]
name = "qemu_ssh_agent"
path = "src/lib.rs"

[features]
# Debug-only diagnostics: forward QEMU stderr (engine errors) and stdout (guest
# serial console) into hilog. bundle-ohos enables this for debug builds.
qemu_debug_assertions = []

[dependencies]
async-io = "2"
libc = "0.2"
log = "0.4"
qemu-cmd-agent-linker = { path = "../../cmd-agent-linker" }
qemu-cmd-agent-protocol = { path = "../../cmd-agent-protocol" }
russh = { version = "0.55", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
smol = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs"] }
rand_core = "0.6"

[target.'cfg(target_env = "ohos")'.dependencies]
# virtio-fs backend daemon embedded in-process (same as qemu-cmd-agent). Only
# built for OHOS; other platforms keep compiling without the vhost-user stack.
# The vhost/vhost-user-backend/vm-memory versions are pinned to match what
# virtiofsd 1.14 resolves, so cargo does not build a second copy.
virtiofsd = { workspace = true }
vhost = "0.16"
vhost-user-backend = "0.22"
vm-memory = "0.17.1"
