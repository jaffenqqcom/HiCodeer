[package]
name = "qemu-ssh-agentd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Guest-side SSH agent for the zcoder QEMU guest (russh server)"

[[bin]]
name = "ssh-agentd"
path = "src/main.rs"

[dependencies]
# Same russh configuration as the OpenEuler cmd-agent: ring backend (pure Rust,
# fast compile) instead of the default aws-lc-rs. The client and server modules
# are compiled unconditionally, so this config serves both sides of the SSH
# tunnel.
russh = { version = "0.55", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
libc = "0.2"
rand_core = "0.6"
