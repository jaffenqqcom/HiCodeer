[package]
name = "qemu-cmd-agent-linker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stable interface for the QEMU remote-command executor, decoupling util from the concrete cmd-agent"

[lib]
name = "qemu_cmd_agent_linker"
path = "src/lib.rs"

[dependencies]
log = "0.4"
qemu-cmd-agent-protocol = { path = "../cmd-agent-protocol" }
smol = "2"
