[package]
name = "qemu-ssh-agent-linker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stable interface bridging the QEMU SSH command executor and folder mounter to the backend-agnostic command_executor, decoupling util from qemu-ssh-agent"

[lib]
name = "qemu_ssh_agent_linker"
path = "src/lib.rs"

[dependencies]
command-executor = { path = "../../command-executor" }
log = "0.4"
smol = "2"
