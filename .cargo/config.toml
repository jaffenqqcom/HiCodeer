[build]
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
# Keep similar flags here to share some ccache
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    "-C",
    "target-feature=+crt-static", # This fixes the linking issue when compiling livekit on Windows
]

# `--cfg gles` compiles the GLES backend INTO the patched wgpu tree. It is
# consumed by `#[cfg(gles)]` in the wgpu/wgpu-core/wgpu-hal crates of
# github.com/jaffenqqcom/wgpu-zed and
# declared in crates/gpui/build.rs. It does NOT select the runtime backend:
# gpui_ohos defaults to Vulkan -- see crates/gpui_ohos/src/ohos/wgpu_context.rs
# (`wgpu::Backends::VULKAN`), where an A/B test measured lower CPU usage than
# GLES (~7% less while scrolling, 16-30% less while idle). Use the
# WGPU_BACKEND=gles environment variable at runtime for the GLES fallback.
# This applies to all OHOS targets (e.g., aarch64-unknown-linux-ohos).
#
# rustix_use_libc: OHOS reports target_os = "linux", so rustix picks its
# linux_raw backend and issues syscalls through inline `svc` assembly, which
# bypasses the libc entry points entirely. That makes the libc-level shim in
# `crates/gpui_ohos/depend/ohos-libc-shim` unable to see rustix's file
# accesses. This cfg (a documented rustix switch, also used for Android and
# miri) selects rustix's libc backend instead, routing those calls through
# `openat`/`stat`/... so the shim can re-activate the picker grant and retry.
[target.'cfg(target_env = "ohos")']
rustflags = [
    "--cfg",
    "gles",
    "--cfg",
    "rustix_use_libc",
]

# Also configure for the specific OHOS target triple if needed
[target.aarch64-unknown-linux-ohos]
rustflags = [
    "--cfg",
    "gles",
    "--cfg",
    "rustix_use_libc",
    "-C",
    "target-feature=+fp16",
]

# We need lld to link libwebrtc.a successfully on aarch64-linux
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
